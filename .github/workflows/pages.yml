# Déploiement automatique de l'accordeur sur GitHub Pages.
#
# PRÉREQUIS, à faire une seule fois à la main (le jeton du workflow n'a pas le
# droit de créer le site Pages lui-même : « Resource not accessible by integration ») :
#   1. Le dépôt doit être PUBLIC. Pages sur un dépôt privé exige un abonnement
#      payant, et le site reste alors réservé aux membres du dépôt.
#      Settings → General → Danger Zone → Change repository visibility → Public.
#   2. Settings → Pages → Build and deployment → Source : « GitHub Actions ».
# Ensuite, chaque push sur la branche par défaut redéploie le site.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main, master, claude/orchestra-tuner-app-1fxuza]
  workflow_dispatch:

# Prérequis côté dépôt : GitHub Pages n'est disponible que sur un dépôt public
# (ou avec un abonnement GitHub Pro / Team / Enterprise pour un dépôt privé).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true active GitHub Pages sur le dépôt si ce n'est pas déjà fait,
      # au lieu d'échouer avec « Get Pages site failed / Not Found ».
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
